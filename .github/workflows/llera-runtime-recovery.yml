name: LLera Runtime Recovery Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'llera/reconstructed-monolith/src/runtime-lifecycle.js'
      - 'llera/reconstructed-monolith/src/runtime-inference-coordinator.js'
      - 'llera/reconstructed-monolith/test/runtime-*.test.js'
      - '.github/workflows/llera-runtime-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run runtime lifecycle and recovery regressions
        working-directory: llera/reconstructed-monolith
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            test/runtime-lifecycle.test.js
            test/runtime-inference-coordinator.test.js
            test/runtime-switch-drain.test.js
            test/runtime-switch-rollback.test.js
            test/runtime-failed-start-orphan-guard.test.js
            test/runtime-recovery-stop-fail-closed.test.js
            test/runtime-recovery-inference-drain.test.js
            test/runtime-direct-stop-inference-drain.test.js
          )
          for test_file in "${tests[@]}"; do
            echo "::group::$test_file"
            node "$test_file"
            echo "::endgroup::"
          done
