name: AArel OS Runtime Evidence

on:
  push:
    branches: [aarelos-ci-sprint]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: [self-hosted, linux, x64, aarelos]
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Runner heartbeat
        shell: bash
        run: |
          set -euxo pipefail
          echo "AARELOS_RUNTIME_RUNNER=PASS"
          uname -a
          df -h /
          free -h

      - name: Checkout repository without external actions
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .git
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-14 g++-14 cmake curl \
            libmpfr-dev libmpc-dev libgmp-dev e2fsprogs fuse2fs \
            ninja-build qemu-system-x86 qemu-system-gui qemu-utils ovmf \
            ccache rsync unzip texinfo libssl-dev zlib1g-dev \
            python3 python3-pil xvfb imagemagick
          gcc-14 --version | head -1
          g++-14 --version | head -1
          qemu-system-x86_64 --version | head -1

      - name: Build and runtime gate
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          set -euxo pipefail
          bash aarelos-ci/run-ci.sh

      - name: Publish evidence summary without external actions
        if: always()
        shell: bash
        run: |
          set +e
          echo "## AArel OS runtime evidence" >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo "Commit: ${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          if [ -d aarelos-evidence ]; then
            echo '```text' >> "${GITHUB_STEP_SUMMARY}"
            find aarelos-evidence -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
            if [ -f aarelos-evidence/passed-gates.txt ]; then
              echo '### Passed gates' >> "${GITHUB_STEP_SUMMARY}"
              cat aarelos-evidence/passed-gates.txt >> "${GITHUB_STEP_SUMMARY}"
            fi
            if [ -f aarelos-evidence/final-status.txt ]; then
              echo '### Final status' >> "${GITHUB_STEP_SUMMARY}"
              cat aarelos-evidence/final-status.txt >> "${GITHUB_STEP_SUMMARY}"
            fi
          else
            echo "No evidence directory was produced." >> "${GITHUB_STEP_SUMMARY}"
          fi
