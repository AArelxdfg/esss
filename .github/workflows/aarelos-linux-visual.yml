name: AArel OS Linux Visual Gate

on:
  push:
    branches: [aarelos-linux-one-day]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  visual-contract:
    runs-on: [self-hosted, linux, x64, aarelos]
    timeout-minutes: 30
    steps:
      - name: Checkout without external actions
        shell: bash
        run: |
          set -euxo pipefail
          git init .
          git remote remove origin || true
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git reset --hard FETCH_HEAD
          git clean -ffd

      - name: Install validators
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck libxml2-utils desktop-file-utils

      - name: Shell gates
        shell: bash
        run: |
          set -euxo pipefail
          shellcheck aarelos-linux/bootstrap-packages.sh
          shellcheck aarelos-linux/overlay/usr/lib/aarel/apply-visual.sh
          bash -n aarelos-linux/bootstrap-packages.sh
          bash -n aarelos-linux/overlay/usr/lib/aarel/apply-visual.sh
          bash aarelos-linux/bootstrap-packages.sh --check

      - name: Theme and desktop gates
        shell: bash
        run: |
          set -euxo pipefail
          xmllint --noout aarelos-linux/overlay/usr/share/wallpapers/AArelMonolith/contents/images/3840x2160.svg
          desktop-file-validate aarelos-linux/overlay/etc/xdg/autostart/aarel-first-session.desktop
          grep -F 'Name=AArel Monolith' aarelos-linux/overlay/usr/share/color-schemes/AArelMonolith.colors
          grep -F 'ColorScheme=AArelForge' aarelos-linux/overlay/usr/lib/aarel/apply-visual.sh
          grep -F 'floating = true' aarelos-linux/overlay/usr/share/aarel/plasma-layout.js
          grep -F 'blurEnabled true' aarelos-linux/overlay/usr/lib/aarel/apply-visual.sh
          echo 'AAREL_LINUX_VISUAL_CONTRACT=PASS'
