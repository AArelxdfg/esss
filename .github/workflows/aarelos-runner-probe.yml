name: AArel OS Runner Probe

on:
  push:
    branches: [aarelos-ci-sprint]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe runner
        shell: bash
        run: |
          echo "AARELOS_RUNNER_PROBE=PASS"
          echo "AARELOS_PROBE_REV=2026-08-24T15:47+03:00"
          uname -a
          date -u
