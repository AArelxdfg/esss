name: AArel OS Runtime Evidence

on:
  push:
    branches: [aarelos-ci-sprint]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl libmpfr-dev libmpc-dev libgmp-dev e2fsprogs ninja-build qemu-system-x86 qemu-system-gui qemu-utils ovmf ccache rsync unzip texinfo libssl-dev zlib1g-dev python3 python3-pil xvfb imagemagick
      - name: Build and runtime gate
        run: bash aarelos-ci/run-ci.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aarelos-runtime-evidence
          path: aarelos-evidence/
          if-no-files-found: warn
