menuentry "Start AArel MMonolith OS" {
    set gfxpayload=keep
    linux /casper/vmlinuz iso-scan/filename=${iso_path} console=ttyS0,115200 systemd.log_target=console systemd.log_level=info --- quiet splash
    initrd /casper/initrd
}
menuentry "Start AArel MMonolith OS (safe graphics)" {
    set gfxpayload=keep
    linux /casper/vmlinuz nomodeset iso-scan/filename=${iso_path} console=ttyS0,115200 systemd.log_target=console systemd.log_level=info --- quiet splash
    initrd /casper/initrd
}
