name: LLera vision restore

on:
  push:
    branches: [main]
    paths:
      - 'llera/reconstructed-monolith/src/vision-pipeline.js'
      - 'llera/reconstructed-monolith/src/vision-runtime-adapter.js'
      - 'llera/reconstructed-monolith/test/vision-runtime-adapter.test.js'
      - 'llera/reconstructed-monolith/test/vision-backend-recovery.test.js'
      - 'llera/reconstructed-monolith/test/vision-hostguard.test.js'
      - 'llera/reconstructed-monolith/test/vision-input-snapshot-isolation.test.js'
      - 'llera/reconstructed-monolith/test/vision-input-coercion-boundary.test.js'
      - 'llera/reconstructed-monolith/test/vision-ocr-output-boundary.test.js'
      - 'llera/reconstructed-monolith/test/vision-model-output-boundary.test.js'
      - '.github/workflows/llera-vision-restore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vision-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check llera/reconstructed-monolith/src/vision-pipeline.js
          node --check llera/reconstructed-monolith/src/vision-runtime-adapter.js
      - name: Vision runtime adapter
        run: node llera/reconstructed-monolith/test/vision-runtime-adapter.test.js
      - name: Vision backend recovery
        run: node llera/reconstructed-monolith/test/vision-backend-recovery.test.js
      - name: Vision HOSTGUARD admission
        run: node llera/reconstructed-monolith/test/vision-hostguard.test.js
      - name: Vision immutable input snapshot
        run: node llera/reconstructed-monolith/test/vision-input-snapshot-isolation.test.js
      - name: Vision coercion boundary
        run: node llera/reconstructed-monolith/test/vision-input-coercion-boundary.test.js
      - name: Vision OCR output boundary
        run: node llera/reconstructed-monolith/test/vision-ocr-output-boundary.test.js
      - name: Vision model output boundary
        run: node llera/reconstructed-monolith/test/vision-model-output-boundary.test.js
