name: LLera Runtime Restore

on:
  push:
    branches: [main]
    paths:
      - 'llera/reconstructed-monolith/src/runtime-lifecycle.js'
      - 'llera/reconstructed-monolith/src/runtime-completion-guard.js'
      - 'llera/reconstructed-monolith/src/runtime-inference-coordinator.js'
      - 'llera/reconstructed-monolith/test/runtime-*.test.js'
      - '.github/workflows/llera-runtime-restore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Record exact commit
        run: |
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
          git status --porcelain
      - name: Node version
        run: node --version
      - name: Runtime lifecycle regressions
        working-directory: llera/reconstructed-monolith
        run: |
          set -euo pipefail
          for test in \
            test/runtime-lifecycle.test.js \
            test/runtime-pid-guard-edge-cases.test.js \
            test/runtime-failed-start-orphan-guard.test.js \
            test/runtime-recovery-stop-fail-closed.test.js \
            test/runtime-recovery-inference-drain.test.js \
            test/runtime-direct-stop-inference-drain.test.js \
            test/runtime-start-stop-race-guard.test.js \
            test/runtime-inference-admission-drain-race.test.js \
            test/runtime-transition-serialization.test.js \
            test/runtime-inference-coordinator.test.js \
            test/runtime-generation-bound-completion.test.js \
            test/runtime-direct-generation-completion-guard.test.js \
            test/runtime-generation-required-completion.test.js
          do
            echo "=== $test ==="
            node "$test"
          done
