name: AArel OS Linux ISO Build

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: [self-hosted, linux, x64, aarelos]
    timeout-minutes: 360
    steps:
      - name: Checkout without external actions
        shell: bash
        run: |
          set -euxo pipefail
          git init .
          git remote remove origin || true
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git reset --hard FETCH_HEAD
          git clean -ffd

      - name: Host dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            curl xorriso squashfs-tools rsync qemu-system-x86 ovmf \
            imagemagick tesseract-ocr python3 python3-pil

      - name: Build genuine AArel hybrid ISO
        shell: bash
        run: |
          set -euxo pipefail
          sudo -E env \
            AAREL_CACHE="$HOME/.cache/aarelos-linux" \
            AAREL_WORK="$HOME/.cache/aarelos-linux/work" \
            AAREL_OUT="$GITHUB_WORKSPACE/AArelOS-Linux-Preview-amd64.iso" \
            bash aarelos-linux/build-preview.sh

      - name: UEFI QEMU screenshot smoke test
        shell: bash
        env:
          AAREL_BOOT_WAIT: '150'
          AAREL_EVIDENCE: aarelos-linux-evidence
        run: |
          set -euxo pipefail
          bash aarelos-linux/qemu-smoke.sh AArelOS-Linux-Preview-amd64.iso

      - name: Publish local delivery bundle
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p AArelOS-Linux-Preview
          cp -f AArelOS-Linux-Preview-amd64.iso* AArelOS-Linux-Preview/ 2>/dev/null || true
          cp -a aarelos-linux-evidence AArelOS-Linux-Preview/ 2>/dev/null || true
          cp -f aarelos-linux/ONE_DAY_PIVOT.md AArelOS-Linux-Preview/ 2>/dev/null || true
          echo "## AArel OS Linux ISO" >> "$GITHUB_STEP_SUMMARY"
          find AArelOS-Linux-Preview -maxdepth 2 -type f -printf '%p %s bytes\n' | sort >> "$GITHUB_STEP_SUMMARY"
          if [[ -d /mnt/c/Users/arelx/Desktop ]]; then
            rm -rf /mnt/c/Users/arelx/Desktop/AArelOS-Linux-Preview
            cp -a AArelOS-Linux-Preview /mnt/c/Users/arelx/Desktop/
            echo "Copied to C:\\Users\\arelx\\Desktop\\AArelOS-Linux-Preview" >> "$GITHUB_STEP_SUMMARY"
          fi
