name: AArel OS Runtime Evidence

on:
  push:
    branches: [aarelos-ci-sprint]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Runner heartbeat
        shell: bash
        run: |
          set -euxo pipefail
          echo "AARELOS_RUNTIME_RUNNER=PASS"
          uname -a
          df -h /
          free -h
      - uses: actions/checkout@v4
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-14 g++-14 cmake curl libmpfr-dev libmpc-dev libgmp-dev e2fsprogs fuse2fs ninja-build qemu-system-x86 qemu-system-gui qemu-utils ovmf ccache rsync unzip texinfo libssl-dev zlib1g-dev python3 python3-pil xvfb imagemagick
          gcc-14 --version | head -1
          g++-14 --version | head -1
      - name: Build and runtime gate
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
        run: bash aarelos-ci/run-ci.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aarelos-runtime-evidence
          path: aarelos-evidence/
          if-no-files-found: warn
