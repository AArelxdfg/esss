set timeout=10

loadfont unicode

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Start AArel MMonolith OS" {
    set gfxpayload=keep
    linux /casper/vmlinuz console=ttyS0,115200 systemd.log_target=console systemd.log_level=info --- quiet splash
    initrd /casper/initrd
}
menuentry "Start AArel MMonolith OS (safe graphics)" {
    set gfxpayload=keep
    linux /casper/vmlinuz nomodeset console=ttyS0,115200 systemd.log_target=console systemd.log_level=info --- quiet splash
    initrd /casper/initrd
}

if [ "$grub_platform" = "efi" ]; then
menuentry 'Boot from next volume' {
    exit 1
}
menuentry 'UEFI Firmware Settings' {
    fwsetup
}
fi
