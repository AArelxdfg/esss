name: AArel OS CI Diagnostics

on:
  push:
    branches: [aarelos-ci-sprint]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Runner heartbeat
        shell: bash
        run: |
          set -euxo pipefail
          echo "AARELOS_RUNNER_HEARTBEAT=PASS"
          uname -a
          python3 --version
          df -h /
          free -h
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Collect environment
        shell: bash
        run: |
          mkdir -p aarelos-diag
          {
            echo "heartbeat=PASS"
            echo "uname:"; uname -a
            echo "cmake:"; cmake --version | head -1 || true
            echo "ninja:"; ninja --version || true
            echo "gcc:"; gcc --version | head -1 || true
            echo "python:"; python3 --version || true
            echo "disk:"; df -h /
            echo "memory:"; free -h
          } | tee aarelos-diag/environment.txt
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: aarelos-ci-diagnostics
          path: aarelos-diag/
          if-no-files-found: error
