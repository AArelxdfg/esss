name: LLera capability restore

on:
  push:
    branches: [main]
    paths:
      - 'llera/reconstructed-monolith/src/monolith-capability-broker.js'
      - 'llera/reconstructed-monolith/src/agent-tool-router.js'
      - 'llera/reconstructed-monolith/src/tool-surface.js'
      - 'llera/reconstructed-monolith/src/guarded-tool-broker.js'
      - 'llera/reconstructed-monolith/src/evidence-ledger.js'
      - 'llera/reconstructed-monolith/src/dual-verifier.js'
      - 'llera/reconstructed-monolith/test/monolith-capability-broker-coverage.test.js'
      - 'llera/reconstructed-monolith/test/monolith-capability-broker-62-executable.test.js'
      - 'llera/reconstructed-monolith/test/agent-tool-router-62.test.js'
      - 'llera/reconstructed-monolith/test/tool-surface-62.test.js'
      - 'llera/reconstructed-monolith/test/target-bound-verification-debt.test.js'
      - 'llera/reconstructed-monolith/test/independent-verification-debt.test.js'
      - 'llera/reconstructed-monolith/test/evidence-verifier.test.js'
      - 'llera/reconstructed-monolith/test/evidence-id-binding.test.js'
      - 'llera/reconstructed-monolith/test/dual-verifier-evidence-coverage.test.js'
      - 'llera/reconstructed-monolith/test/structured-evidence-provenance.test.js'
      - '.github/workflows/llera-capability-restore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check llera/reconstructed-monolith/src/monolith-capability-broker.js
          node --check llera/reconstructed-monolith/src/agent-tool-router.js
          node --check llera/reconstructed-monolith/src/tool-surface.js
          node --check llera/reconstructed-monolith/src/guarded-tool-broker.js
          node --check llera/reconstructed-monolith/src/evidence-ledger.js
          node --check llera/reconstructed-monolith/src/dual-verifier.js
      - name: Historical 62-tool declaration
        run: node llera/reconstructed-monolith/test/tool-surface-62.test.js
      - name: 62-tool router
        run: node llera/reconstructed-monolith/test/agent-tool-router-62.test.js
      - name: Executable capability broker coverage
        run: node llera/reconstructed-monolith/test/monolith-capability-broker-coverage.test.js
      - name: Full 62-tool executable parity
        run: node llera/reconstructed-monolith/test/monolith-capability-broker-62-executable.test.js
      - name: Target-bound verification debt
        run: node llera/reconstructed-monolith/test/target-bound-verification-debt.test.js
      - name: Independent verification debt
        run: node llera/reconstructed-monolith/test/independent-verification-debt.test.js
      - name: Evidence and dual verifier baseline
        run: |
          node llera/reconstructed-monolith/test/evidence-verifier.test.js
          node llera/reconstructed-monolith/test/evidence-id-binding.test.js
          node llera/reconstructed-monolith/test/dual-verifier-evidence-coverage.test.js
      - name: Structured evidence provenance
        run: node llera/reconstructed-monolith/test/structured-evidence-provenance.test.js
