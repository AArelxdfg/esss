name: LLera Runtime Recovery Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'llera/reconstructed-monolith/src/runtime-lifecycle.js'
      - 'llera/reconstructed-monolith/src/runtime-inference-coordinator.js'
      - 'llera/reconstructed-monolith/test/runtime-*.test.js'
      - '.github/workflows/llera-runtime-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-recovery:
    name: runtime-recovery (${{ matrix.test }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        test:
          - runtime-lifecycle
          - runtime-inference-coordinator
          - runtime-switch-drain
          - runtime-switch-rollback
          - runtime-failed-start-orphan-guard
          - runtime-recovery-stop-fail-closed
          - runtime-recovery-inference-drain
          - runtime-direct-stop-inference-drain
          - runtime-inference-admission-drain-race
          - runtime-start-stop-race-guard
          - runtime-transition-serialization
          - runtime-host-pressure-drain-serialization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ${{ matrix.test }} regression
        working-directory: llera/reconstructed-monolith
        run: node "test/${{ matrix.test }}.test.js"
